# Release automation, tied to Semantic Versioning (https://semver.org).
#
# When you push a version TAG shaped like SemVer, this robot builds the
# standalone Android APK (JS bundle baked in, no Metro needed) and publishes it
# as a GitHub Release with auto-written notes. So cutting a release becomes:
#
#     git tag v0.2.0          # MAJOR.MINOR.PATCH  (see SemVer)
#     git push origin v0.2.0
#
# A tag ending in "-something" (e.g. v0.2.0-rc.1) is published as a *pre-release*
# — your "test it on the watches first" version — instead of a full release.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"     # v1.2.3     -> full release
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # v1.2.3-rc.1 -> pre-release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        working-directory: android
        run: npm ci
      # src/config/version.ts and src/config/secrets.ts are gitignored (not in the repo), but
      # the RELEASE JS bundle imports both (a debug build doesn't bundle, which is why build.yml
      # never needed them). Regenerate them here: the version from package.json (single source
      # of truth) plus the short commit SHA; the Strava OAuth creds from repo Actions secrets
      # when configured (empty otherwise - Strava sign-in is then inert in the release APK, and
      # everything else works). Set STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET as repo secrets to
      # enable Strava in released builds.
      - name: Generate build-time config (version + secrets)
        working-directory: android
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p src/config
          printf "export const BUILD_SHA = '%s';\nexport const APP_VERSION = '%s';\n" \
            "${GITHUB_SHA::7}" "$V" > src/config/version.ts
          printf "export const STRAVA_CLIENT_ID = '%s';\nexport const STRAVA_CLIENT_SECRET = '%s';\n" \
            "$STRAVA_CLIENT_ID" "$STRAVA_CLIENT_SECRET" > src/config/secrets.ts
      - name: Build the standalone release APK (bundle baked in)
        working-directory: android/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Rename APK to include the version tag
        run: |
          mkdir -p out
          cp android/android/app/build/outputs/apk/release/*.apk \
             "out/Sommet_${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  publish:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      # The release text = the changelog sections since the previous version. Both apps show
      # its "## date: title" headings as the "What's new" list of their update note.
      - name: Write the release notes from the changelog
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish the GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true                              # adds the "Full Changelog" link
          prerelease: ${{ contains(github.ref_name, '-') }}          # v..-rc.1 => pre-release
          files: out/*.apk
