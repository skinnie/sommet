# Builds the DESKTOP app (the Qt/QML one) into finished, downloadable files for
# ordinary users: a Windows .zip (with a double-click .exe inside) and a macOS .dmg.
#
# You never run this yourself. GitHub lends us a real Windows PC and a real Mac in the
# cloud; this recipe tells each of them to build the app and wrap it up. The results end
# up as downloads on the run's own page, and (when you cut a release) on the Releases page
# next to the Android APK.
#
# HOW TO TEST IT WITHOUT MAKING A REAL RELEASE:
#   GitHub website -> your repo -> "Actions" tab -> "desktop apps" on the left ->
#   "Run workflow" button. A few minutes later the finished Windows/Mac files appear at the
#   bottom of that run's page as "Artifacts" you can download.
#
# HOW A REAL RELEASE HAPPENS:
#   Pushing a version tag (e.g. v0.2.0) runs this automatically AND attaches the Windows and
#   Mac downloads to the published Release. (The separate release.yml already does this for
#   the Android APK; this file adds desktop to the same Release.)
#
# The behind-the-scenes "engine" that talks to the watch (the Python helper, server.py) is
# frozen with PyInstaller into a single "ambit-backend" executable and bundled INSIDE the
# app, so the download works without Python installed. The C++ app auto-starts it (see
# desktop/src/services/backendprocess.cpp).
name: desktop apps

on:
  workflow_dispatch:            # the "Run workflow" button, for testing on demand
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"     # v1.2.3      -> attach to the full release
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # v1.2.3-rc.1 -> attach to the pre-release

jobs:
  # ---- Windows: produce a .zip containing Sommet.exe and everything it needs -------------
  windows:
    runs-on: windows-latest
    # Needed for the tag build's "Attach to the Release" step to create/update the Release
    # (the default GITHUB_TOKEN is read-only otherwise -> 403 "Resource not accessible").
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Installing Qt on Windows via aqt is doubly broken for the newest releases: (1) Qt split
      # the Windows repo by compiler for 6.11+ (qt6_61x0/qt6_61x0_msvc2022_64/ ...) and aqt 3.3.0
      # - the newest aqt on PyPI - still looks at the old qt6_61x0/qt6_61x0/ path => 404; (2) its
      # Updates.xml checksum fetch is flaky ("Failed to download checksum"). So: pin to 6.10.3
      # (newest Windows Qt aqt can still resolve; the app only needs >= 6.5, see CMakeLists), and
      # write a settings.ini that forces Qt's official mirror and tolerates the missing hash.
      # macOS keeps 6.12.0 (its old-layout repo still works via install-qt-action).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt 6.10 (aqt, official mirror, hash-tolerant)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "aqtinstall==3.3.*"
          @(
            '[requests]',
            'max_retries_on_connection_error : 5',
            'max_retries_on_checksum_error : 5',
            'max_retries_to_retrieve_hash : 5',
            'hash_algorithm : sha256',
            'INSECURE_NOT_FOR_PRODUCTION_ignore_hash : True',
            '[mirrors]',
            'trusted_mirrors :',
            '    https://download.qt.io',
            'fallbacks :',
            '    https://download.qt.io'
          ) | Set-Content -Path aqt_settings.ini -Encoding ascii
          python -m aqt -c aqt_settings.ini install-qt windows desktop 6.10.3 win64_msvc2022_64 `
            --outputdir "$env:RUNNER_WORKSPACE\Qt"
          $qt = "$env:RUNNER_WORKSPACE\Qt\6.10.3\msvc2022_64"
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (Release)
        run: |
          cmake -S desktop -B desktop/build
          cmake --build desktop/build --config Release

      # Freeze the Python watch helper into a single ambit-backend.exe (no Python needed on
      # the user's PC). bleak = Bluetooth, hid = USB; see tools/packaging/ambit_backend.spec.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `hid` (the Python USB package) loads hidapi.dll lazily via ctypes, so PyInstaller never
      # sees it and it won't ship unless we hand it over explicitly. Grab the official prebuilt
      # DLL from the libusb/hidapi release and let the spec bundle it (HIDAPI_DLL). Without this
      # the watch is never detected on a clean Windows PC (Sommet v0.1.46 bug).
      - name: Fetch hidapi.dll (native USB lib for `hid`)
        shell: pwsh
        run: |
          $ver = "0.14.0"
          $url = "https://github.com/libusb/hidapi/releases/download/hidapi-$ver/hidapi-win.zip"
          Invoke-WebRequest -Uri $url -OutFile hidapi-win.zip
          Expand-Archive -Path hidapi-win.zip -DestinationPath hidapi-win -Force
          $dll = Resolve-Path "hidapi-win\x64\hidapi.dll"
          "HIDAPI_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "hidapi.dll -> $dll"
      - name: Freeze the watch helper (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller bleak hid
          pyinstaller tools/packaging/ambit_backend.spec --distpath dist/backend --workpath build/pyi

      # windeployqt copies the Qt DLLs and QML plugins the app needs into a self-contained
      # folder next to the .exe, so it runs on a PC that has never had Qt installed. --qmldir
      # points it at our QML so it knows which QML modules to bundle. Then drop the frozen
      # helper into backend\ next to it (where BackendProcess looks for it) and zip it all up.
      - name: Bundle Qt runtime + helper, then zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows\Sommet | Out-Null
          # The CMake target's OUTPUT_NAME is Sommet (see desktop/CMakeLists.txt), so the build
          # already produces Sommet.exe - the download the user double-clicks is branded Sommet.
          Copy-Item desktop\build\Release\Sommet.exe dist\windows\Sommet\Sommet.exe
          windeployqt --qmldir desktop\qml --release dist\windows\Sommet\Sommet.exe
          New-Item -ItemType Directory -Force -Path dist\windows\Sommet\backend | Out-Null
          Copy-Item dist\backend\ambit-backend.exe dist\windows\Sommet\backend\
          Compress-Archive -Path dist\windows\Sommet\* -DestinationPath dist\Sommet-windows.zip

      - name: Keep the download
        uses: actions/upload-artifact@v4
        with:
          name: Sommet-windows
          path: dist/Sommet-windows.zip

      # Only when this run was started by a version tag: attach the .zip to the Release.
      - name: Attach to the Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sommet-windows.zip

  # ---- macOS: produce a .dmg the user drags into Applications -----------------------------
  macos:
    runs-on: macos-latest
    # See the windows job: contents:write lets the tag build attach its .dmg to the Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"

      # -DCMAKE_OSX_DEPLOYMENT_TARGET pins the app's minimum macOS. Without it, CMake stamps
      # LSMinimumSystemVersion with the *build runner's* macOS (now newer than many users'
      # Macs), so the .app refuses to launch with "you can't use this version of the
      # application with this version of macOS" (Sommet v0.1.46 bug, hit on macOS 15.7.9).
      # 12.0 (Monterey) is a safe floor for Qt 6.12; raise it only if the build complains.
      - name: Build (Release)
        run: |
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build desktop/build

      # Freeze the Python watch helper into a single ambit-backend (no Python needed on the
      # user's Mac). bleak = Bluetooth, hid = USB; see tools/packaging/ambit_backend.spec.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # macOS has the same hidapi gap as Windows: the `hid` wheel bundles no libhidapi.dylib, so
      # /api/devices can't enumerate the watch on a clean Mac (first Mac hardware test, 2026-08-27).
      # Install it via Homebrew (preinstalled on the runner) and hand its path to PyInstaller via
      # HIDAPI_DYLIB; ambit_backend.spec bundles it at the app root.
      - name: Fetch libhidapi.dylib (native USB lib for `hid`)
        run: |
          brew install hidapi
          echo "HIDAPI_DYLIB=$(brew --prefix hidapi)/lib/libhidapi.dylib" >> "$GITHUB_ENV"
      # Ambit1/2 (routes, POIs, personal settings) go through the compiled ambit_legacy_cli,
      # which nothing in CI ever built - so every packaged build shipped without it and those
      # endpoints returned "ambit_legacy_cli is not built". build.sh is macOS-aware as of the
      # macos build fixes; it needs cmake and pkg-config, and links the system hidapi.
      - name: Build ambit_legacy_cli (Ambit1/2 support)
        run: |
          brew install cmake pkg-config libusb
          ./tools/vendor/ambit_legacy_cli/build.sh
          test -x tools/vendor/ambit_legacy_cli/ambit_legacy_cli
      - name: Freeze the watch helper (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller bleak hid
          pyinstaller tools/packaging/ambit_backend.spec --distpath dist/backend --workpath build/pyi

      # macdeployqt copies the Qt frameworks and QML plugins into the .app so it runs on a Mac
      # that has never had Qt installed. Then drop the frozen helper into
      # Contents/Resources/backend/ (where BackendProcess looks for it) and wrap the .app in a
      # .dmg with hdiutil.
      - name: Bundle Qt runtime + helper, then make the .dmg
        run: |
          APP=$(find desktop/build -maxdepth 1 -name "*.app" | head -1)
          echo "Found app bundle: $APP"
          # The internal CMake target is still named ambitapp, so the bundle builds as
          # ambitapp.app. Rename the bundle directory to Sommet.app so the user drags a
          # "Sommet" app into Applications. The executable inside (Contents/MacOS/ambitapp)
          # and its Info.plist CFBundleExecutable are unchanged, so it still launches; the
          # dock/menu name is already "Sommet" via setApplicationDisplayName in main.cpp.
          if [ "$(basename "$APP")" != "Sommet.app" ]; then
            SOMMET="$(dirname "$APP")/Sommet.app"
            mv "$APP" "$SOMMET"
            APP="$SOMMET"
          fi
          echo "Packaging bundle: $APP"
          macdeployqt "$APP" -qmldir=desktop/qml
          mkdir -p "$APP/Contents/Resources/backend"
          cp dist/backend/ambit-backend "$APP/Contents/Resources/backend/"
          chmod +x "$APP/Contents/Resources/backend/ambit-backend"
          # Ship libhidapi.dylib next to the helper so the app can point DYLD_LIBRARY_PATH at this
          # dir (see backendprocess.cpp) and the frozen `hid` can dlopen it - no brew or env needed
          # on the user's Mac. -L copies the real lib through the Homebrew symlink, named exactly
          # "libhidapi.dylib" (the name `hid` requests).
          cp -L "$(brew --prefix hidapi)/lib/libhidapi.dylib" "$APP/Contents/Resources/backend/libhidapi.dylib"
          # The copied lib still carries Homebrew's install id (/opt/homebrew/opt/hidapi/...),
          # a path that won't exist on a user's Mac - harmless today because `hid` dlopens it by
          # path, but a latent trap. Rewrite it to be self-describing relative to its loader.
          install_name_tool -id "@loader_path/libhidapi.dylib" "$APP/Contents/Resources/backend/libhidapi.dylib"
          # CRITICAL: install_name_tool invalidates the dylib's (Homebrew ad-hoc) signature, and the
          # app-level `codesign --deep` below will NOT fix it - a dylib under Contents/Resources is
          # sealed as a bundle RESOURCE (by hash), never re-signed as nested code. Left broken, dyld
          # SIGKILLs the helper the moment `hid` dlopen()s it ("Code Signature Invalid"), and
          # `codesign --verify --deep` on the .app still PASSES (it only checks the resource seal).
          # So re-sign the dylib itself here, and gate on verifying the dylib directly. (Regression
          # shipped in the first RC, 2026-08-27; caught on-device.)
          codesign --force --sign - "$APP/Contents/Resources/backend/libhidapi.dylib"
          codesign --verify --strict "$APP/Contents/Resources/backend/libhidapi.dylib"
          # Ad-hoc sign the WHOLE bundle last (after macdeployqt rewrote the frameworks and we
          # added the backend, both of which invalidate any signature). Apple Silicon refuses
          # to launch a binary with a broken/absent signature - it shows a 🚫 and reads as
          # "damaged". "--sign -" is a free local signature (no Apple Developer account); it
          # turns "damaged, needs Terminal" into a normal unsigned app (right-click -> Open).
          # A fully double-click-clean app would additionally need a Developer ID + notarization.
          codesign --force --deep --sign - "$APP"
          # Final gate: prove the shipped dylib is still individually loadable AFTER the bundle seal
          # (the .app-level --deep pass must not have disturbed it). This is the check that would
          # have caught the RC regression; `--verify --deep` on the .app alone would not.
          codesign --verify --strict "$APP/Contents/Resources/backend/libhidapi.dylib"
          mkdir -p dist
          hdiutil create -volname Sommet -srcfolder "$APP" -ov -format UDZO dist/Sommet-macos.dmg

      - name: Keep the download
        uses: actions/upload-artifact@v4
        with:
          name: Sommet-macos
          path: dist/Sommet-macos.dmg

      - name: Attach to the Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sommet-macos.dmg
